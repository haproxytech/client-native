name: CI
on: [push, pull_request]
permissions:
  contents: read
  pull-requests: read
jobs:
  check:
    if: ${{ github.event_name == 'pull_request' }}
    name: HAProxy check commit message
    runs-on: ubuntu-latest
    steps:
      - name: commit-check
        uses: docker://ghcr.io/haproxytech/commit-check:5.7.1
        env:
          API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  generate-specification:
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v7.0.1
    - name: Set up Go
      uses: actions/setup-go@v7.0.0
      with:
        go-version-file: "go.mod"
    - name: Compare
      run: |
        go run cmd/specification/*.go -file specification/haproxy-spec.yaml > specification/build/haproxy_spec_to_compare.yaml
        diff -u specification/build/haproxy_spec_to_compare.yaml specification/build/haproxy_spec.yaml
    - name: YAML script validation
      run: |
        chmod +x ./specification/scripts/lint-yaml.sh
        ./specification/scripts/lint-yaml.sh
  generate-models:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: "go.mod"
      - name: clearing models
        run: find models -maxdepth 1 -type f -name "*.go" -exec rm -f {} \;
      - name: generating models
        run: make models
      - name: changes
        run: git diff --exit-code || { echo "::error::Models are not generated, run \`make models\` and commit the result"; exit 1; }
      - name: untracked files
        run: |
          files="$(git ls-files --others --exclude-standard)"
          if [ -n "$files" ]; then
            echo "$files"
            echo "::error::Models generation created untracked files, cannot proceed"
            exit 1
          fi
  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: "go.mod"
      - name: Lint
        run: |
          make lint
  lint-spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: yaml-lint
        uses: ibiqlik/action-yamllint@v3.1.1
        with:
          file_or_dir: .
          config_file: .yamllint.yml
  license:
    name: license-check
    runs-on: ubuntu-latest
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v7.0.1
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: "go.mod"
      - name: go-licenses install
        run: make go-licenses
      - name: Check Licenses
        run: |
          PROJECT="$(go list -m)"
          ALLOWED_LICENSES="$(<.allowed_license_types)"
          go-licenses report --ignore "$PROJECT" .
          go-licenses check --allowed_licenses="$ALLOWED_LICENSES" --ignore "$PROJECT" .
  tidy:
    name: go mod tidy
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: "go.mod"
      - name: tidy
        run: go mod tidy
      - name: changes
        run: git diff --exit-code || { echo "::error::Go modules not tidied, run \`go mod tidy\` and commit the result"; exit 1; }
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v7.0.1
    - name: Set up Go
      uses: actions/setup-go@v7.0.0
      with:
        go-version-file: "go.mod"
    - name: Build
      run: |
        go build -v .
  go-test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v7.0.1
    - name: Set up Go
      uses: actions/setup-go@v7.0.0
      with:
        go-version-file: "go.mod"
    - name: Test
      run: |
        go test -v ./...
  go-test-equal:
    name: Test equal
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v7.0.1
    - name: Set up Go
      uses: actions/setup-go@v7.0.0
      with:
        go-version-file: "go.mod"
    - name: Test
      run: |
        go test -tags equal -v ./...
  e2e:
    name: e2e on HAProxy
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: "go.mod"
      - name: e2e Test
        run: make e2e-docker
