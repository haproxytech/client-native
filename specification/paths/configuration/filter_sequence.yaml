---
filter_sequences:
  get:
    summary: Return an array of all Filter Sequences
    description: Returns all Filter Sequences that are configured in specified parent.
    operationId: getAllFilterSequence{{ .ParentType }}
    tags:
      - FilterSequence
    parameters:
      - $ref: "#/parameters/parent_name"
      - $ref: "#/parameters/transaction_id"
    responses:
      '200':
        description: Successful operation
        headers:
          Configuration-Version:
            description: Configuration file version
            type: string
        schema:
          $ref: "#/definitions/filter_sequences"
      'default':
        $ref: '#/responses/DefaultError'
  put:
    summary: Replace a Filter Sequence list
    description: Replaces a whole list of Filter Sequences with the list given in parameter
    operationId: replaceAllFilterSequence{{ .ParentType }}
    tags:
      - FilterSequence
    parameters:
      - $ref: "#/parameters/parent_name"
      - name: data
        in: body
        required: true
        schema:
          $ref: '#/definitions/filter_sequences'
      - $ref: "#/parameters/transaction_id"
      - $ref: "#/parameters/version"
      - $ref: "#/parameters/force_reload"
    responses:
      '202':
        description: Configuration change accepted and reload requested
        headers:
          Reload-ID:
            description: ID of the requested reload
            type: string
        schema:
          $ref: "#/definitions/filter_sequences"
      '200':
        description: All Filter Sequence lines replaced
        schema:
          $ref: '#/definitions/filter_sequences'
      '400':
        $ref: '#/responses/BadRequest'
      'default':
        $ref: '#/responses/DefaultError'
filter_sequences_one:
  get:
    summary: Return one Filter Sequence
    description: Returns one Filter Sequence configuration by it's index in the specified parent.
    operationId: getFilterSequence{{ .ParentType }}
    tags:
      - FilterSequence
    parameters:
      - name: index
        in: path
        description: Filter Sequence Index
        required: true
        type: integer
      - $ref: "#/parameters/parent_name"
      - $ref: "#/parameters/transaction_id"
    responses:
      '200':
        description: Successful operation
        headers:
          Configuration-Version:
            description: Configuration file version
            type: string
        schema:
          $ref: "#/definitions/filter_sequence"
      '404':
        $ref: '#/responses/NotFound'
      'default':
        $ref: '#/responses/DefaultError'
  put:
    summary: Replace a Filter Sequence
    description: Replaces a Filter Sequence configuration by it's index in the specified parent.
    operationId: replaceFilterSequence{{ .ParentType }}
    tags:
      - FilterSequence
    parameters:
      - name: index
        in: path
        description: Filter Sequence Index
        required: true
        type: integer
      - $ref: "#/parameters/parent_name"
      - name: data
        in: body
        required: true
        schema:
          $ref: '#/definitions/filter_sequence'
      - $ref: "#/parameters/transaction_id"
      - $ref: "#/parameters/version"
      - $ref: "#/parameters/force_reload"
    responses:
      '202':
        description: Configuration change accepted and reload requested
        headers:
          Reload-ID:
            description: ID of the requested reload
            type: string
        schema:
          $ref: "#/definitions/filter_sequence"
      '200':
        description: Filter Sequence replaced
        schema:
          $ref: "#/definitions/filter_sequence"
      '400':
        $ref: '#/responses/BadRequest'
      '404':
        $ref: '#/responses/NotFound'
      'default':
        $ref: '#/responses/DefaultError'
  delete:
    summary: Delete a Filter Sequence
    description: Deletes a Filter Sequence configuration by it's index from the specified parent.
    operationId: deleteFilterSequence{{ .ParentType }}
    tags:
      - FilterSequence
    parameters:
      - name: index
        in: path
        description: Filter Sequence Index
        required: true
        type: integer
      - $ref: "#/parameters/parent_name"
      - $ref: "#/parameters/transaction_id"
      - $ref: "#/parameters/version"
      - $ref: "#/parameters/force_reload"
    responses:
      '202':
        description: Configuration change accepted and reload requested
        headers:
          Reload-ID:
            description: ID of the requested reload
            type: string
      '204':
        description: Filter Sequence deleted
      '404':
        $ref: '#/responses/NotFound'
      'default':
        $ref: '#/responses/DefaultError'
  post:
    summary: Add a new Filter Sequence
    description: Adds a new Filter Sequence in the specified parent.
    operationId: createFilterSequence{{ .ParentType }}
    tags:
      - FilterSequence
    parameters:
      - name: index
        in: path
        description: Filter Sequence Index
        required: true
        type: integer
      - $ref: "#/parameters/parent_name"
      - name: data
        in: body
        required: true
        schema:
          $ref: '#/definitions/filter_sequence'
      - $ref: "#/parameters/transaction_id"
      - $ref: "#/parameters/version"
      - $ref: "#/parameters/force_reload"
    responses:
      '202':
        description: Configuration change accepted and reload requested
        headers:
          Reload-ID:
            description: ID of the requested reload
            type: string
        schema:
          $ref: "#/definitions/filter_sequence"
      '201':
        description: Filter Sequence created
        schema:
          $ref: "#/definitions/filter_sequence"
      '409':
        $ref: '#/responses/AlreadyExists'
      '400':
        $ref: '#/responses/BadRequest'
      'default':
        $ref: '#/responses/DefaultError'
