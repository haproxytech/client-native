      type: string
      enum:
        - reject
        - accept
        - send-retry
        - dgram-drop
        - do-log
      x-nullable: false
    cond:
      type: string
      x-display-name: Condition
      enum: [if, unless]
    cond_test:
      type: string
      x-display-name: Condition Test
      x-dynamic-enum:
        operation: getACLs
        property: acl_name
        freeFormat: true
      x-dependency:
        cond:
          required: true
    log_profile:
      type: string
      x-display-name: Log Profile
      x-dependency:
        type:
          value: do-log
    metadata:
      additionalProperties:
        type: object
  additionalProperties: false
  example:
    type: reject
